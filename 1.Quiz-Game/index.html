<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="start screen active" id="startscreen">
        <h1 class="header">QUIZ Game</h1>
        <p>Test Your Knowledge with Some Fun Questions</p>
        <button class="startbtn btn">Start the Quiz</button>
    </div>
    <div class="quiz screen " id="quizscreen">
        <h1 class="questiontext">Question</h1>
        <div class="score"><p>Questions <span class="currentquestion"> 0</span> Out of <span class="totalquestion"> 5</span></p>
        <p>Score <span class="currentscore">0</span></p></div>
        <div class="answercontainer" id="answercontainer">Answer goes here</div>
    </div>
    <div class="result screen">
        <h1>Quiz Result</h1>
        <div class="resultinfo">
            <h3>You Scored <span class="finalscore"></span> Out Of 5 </h3>
            <p class="dynamic"></p>
        </div>
        <button class="restartbtn btn">Restart Quiz</button>
    </div>
    <script src="app.js"></script>
</body>
</html>
