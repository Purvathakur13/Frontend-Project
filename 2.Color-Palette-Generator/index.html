<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Palette</title>
    <link rel="stylesheet" href="style.css">
    <!-- fontawesomecdn -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <div class="container">
        <h1>Random Color Palette</h1>
        <button class="generatebtn">
            <i class="fa-solid fa-arrows-rotate"></i>
            Generate Palette</button>
        <div class="palettecontainer">
            <!-- colorbox1 -->
            <div class="colorbox">
                <div class="color" style="background-color: #e1f5fe"></div>
                <div class="colorinfo">
                    <span class="hexvalue">#E1F5FE</span>
                    <i class="fa-regular fa-copy copy-btn" title="Copy to clipboard"></i>
                </div>
            </div>
            <!-- colorbox2 -->
            <div class="colorbox">
                <div class="color" style="background-color: #b3e5fc"></div>
                <div class="colorinfo">
                    <span class="hexvalue">#B3E5FC</span>
                    <i class="fa-regular fa-copy copy-btn" title="Copy to clipboard"></i>
                </div>
            </div>
            <!-- colorbox3 -->
            <div class="colorbox">
                <div class="color" style="background-color: #81d4fa"></div>
                <div class="colorinfo">
                    <span class="hexvalue">#81D4FA</span>
                    <i class="fa-regular fa-copy copy-btn" title="Copy to clipboard"></i>
                </div>
            </div>
            <!-- colorbox4 -->
            <div class="colorbox">
                <div class="color" style="background-color: #4fc3f7"></div>
                <div class="colorinfo">
                    <span class="hexvalue">#4FC3F7</span>
                    <i class="fa-regular fa-copy copy-btn" title="Copy to clipboard"></i>
                </div>
            </div>
            <!-- colorbox5 -->
            <div class="colorbox">
                <div class="color" style="background-color: #29b6f6"></div>
                <div class="colorinfo">
                    <span class="hexvalue">#29B6F6</span>
                    <i class="fa-regular fa-copy copy-btn" title="Copy to clipboard"></i>
                </div>
            </div>

        </div>
    </div>
    <script src="app.js"></script>
</body>

</html>
